<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="1000" height="430" fill="#ffffff"/>
<text x="500" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Ke Mana Semua Ini Bermuara</text>
<text x="500" y="55" text-anchor="middle" font-size="13.5" fill="#475569">Dua angka dari hari ini menjadi dua kecepatan minggu depan — dan menjawab teka-teki inti bumi</text>

<rect x="60" y="82" width="170" height="70" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
<text x="145" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Minggu 2</text>
<text x="145" y="130" text-anchor="middle" font-size="17" fill="#0f172a">λ  dan  μ</text>
<text x="145" y="146" text-anchor="middle" font-size="11" fill="#78350f">parameter Lamé</text>

<line x1="230" y1="117" x2="292" y2="117" stroke="#334155" stroke-width="3"/>
<polygon points="300,117 286,110 286,124" fill="#334155"/>
<text x="262" y="106" text-anchor="middle" font-size="11" fill="#64748b">+ densitas ρ</text>

<rect x="306" y="82" width="330" height="70" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="471" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#0e7490">Minggu 3 — dua kecepatan gelombang</text>
<text x="390" y="136" text-anchor="middle" font-size="17" fill="#0f172a">V&#8203;P = √((λ+2μ)/ρ)</text>
<text x="558" y="136" text-anchor="middle" font-size="17" fill="#0f172a">V&#8203;S = √(μ/ρ)</text>

<line x1="636" y1="117" x2="698" y2="117" stroke="#334155" stroke-width="3"/>
<polygon points="706,117 692,110 692,124" fill="#334155"/>

<rect x="712" y="82" width="228" height="70" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="826" y="106" text-anchor="middle" font-size="14" font-weight="700" fill="#15803d">Minggu 12 — kalian ukur sendiri</text>
<text x="826" y="132" text-anchor="middle" font-size="16" fill="#0f172a">V&#8203;P/V&#8203;S = 1,80</text>
<text x="826" y="148" text-anchor="middle" font-size="11" fill="#166534">dari data Yogyakarta 2006</text>

<rect x="150" y="186" width="700" height="112" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="500" y="212" text-anchor="middle" font-size="15.5" font-weight="700" fill="#991b1b">Sekarang lihat rumus V&#8203;S sekali lagi</text>
<text x="500" y="242" text-anchor="middle" font-size="18" fill="#0f172a">V&#8203;S = √(μ/ρ)     dan pada zat cair,  μ = 0</text>
<text x="500" y="270" text-anchor="middle" font-size="14.5" font-weight="700" fill="#991b1b">Maka V&#8203;S = 0. Gelombang S TIDAK BISA menembus zat cair.</text>
<text x="500" y="290" text-anchor="middle" font-size="12.5" fill="#7f1d1d">Bukan karena ia terlalu lemah — melainkan karena secara fisis ia tidak dapat ada di sana.</text>

<rect x="90" y="318" width="820" height="94" rx="10" fill="#0f172a"/>
<text x="500" y="344" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Dan inilah cara manusia tahu inti luar bumi itu cair</text>
<text x="500" y="368" text-anchor="middle" font-size="13" fill="#cbd5e1">Gelombang S dari gempa besar tidak pernah muncul di sisi seberang bumi. Bukan lemah — benar-benar hilang.</text>
<text x="500" y="388" text-anchor="middle" font-size="13" fill="#cbd5e1">Satu-satunya penjelasan: ada lapisan dengan μ = 0 di jalannya. Tidak seorang pun pernah mengebor sampai ke sana.</text>
<text x="500" y="406" text-anchor="middle" font-size="12.5" fill="#7dd3fc" font-style="italic">Kesimpulan terkuat dalam ilmu kebumian justru ditarik dari data yang TIDAK datang. Kita bahas tuntas di Minggu 6.</text>
</svg>
