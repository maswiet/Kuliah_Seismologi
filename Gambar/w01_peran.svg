<text x="590" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Untuk Apa Seismologi Dipelajari?</text>
<text x="590" y="59" text-anchor="middle" font-size="13.5" fill="#475569">Satu jenis data — seismogram — melayani dua tujuan sekaligus</text>
<text x="188" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#0e7490">MEMAHAMI BUMI</text>
<text x="992" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">MELAYANI MASYARAKAT</text>
