<text x="590" y="345" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">LOGI</text>
<text x="590" y="372" text-anchor="middle" font-size="11.5" fill="#94a3b8">seismogram</text>
<text x="590" y="656" text-anchor="middle" font-size="12.5" fill="#64748b">Ditambah dua peran khusus: pemantauan uji coba nuklir (CTBT), dan seismologi planet — Bulan (Apollo) serta Mars (InSight, 2018–2022).</text>
