<rect x="33" y="112" width="310" height="104" rx="11" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="49" y="142" font-size="14.5" font-weight="700" fill="#0e7490">Struktur dalam bumi</text>
<text x="49" y="169" font-size="12.5" fill="#334155">Kerak, mantel, inti;</text>
<text x="49" y="189" font-size="12.5" fill="#334155">tomografi seismik 3-D</text>
<rect x="33" y="246" width="310" height="104" rx="11" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="49" y="276" font-size="14.5" font-weight="700" fill="#0e7490">Tektonik &amp; dinamika</text>
<text x="49" y="303" font-size="12.5" fill="#334155">Gerak lempeng, zona subduksi,</text>
<text x="49" y="323" font-size="12.5" fill="#334155">sesar aktif</text>
<rect x="33" y="380" width="310" height="104" rx="11" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="49" y="410" font-size="14.5" font-weight="700" fill="#0e7490">Fisika sumber gempa</text>
<text x="49" y="437" font-size="12.5" fill="#334155">Mekanisme sesar, stress drop,</text>
<text x="49" y="457" font-size="12.5" fill="#334155">energi yang diradiasikan</text>
<rect x="33" y="514" width="310" height="104" rx="11" fill="#ecfeff" stroke="#0e7490" stroke-width="2"/>
<text x="49" y="544" font-size="14.5" font-weight="700" fill="#0e7490">Seismologi gunung api</text>
<text x="49" y="571" font-size="12.5" fill="#334155">Gempa VT, LP, dan tremor untuk</text>
<text x="49" y="591" font-size="12.5" fill="#334155">pemantauan erupsi</text>
<rect x="837" y="112" width="310" height="104" rx="11" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="853" y="142" font-size="14.5" font-weight="700" fill="#b45309">Mitigasi &amp; peta bahaya</text>
<text x="853" y="169" font-size="12.5" fill="#334155">Peta bahaya gempa nasional,</text>
<text x="853" y="189" font-size="12.5" fill="#334155">mikrozonasi kota</text>
<rect x="837" y="246" width="310" height="104" rx="11" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="853" y="276" font-size="14.5" font-weight="700" fill="#b45309">Peringatan dini</text>
<text x="853" y="303" font-size="12.5" fill="#334155">InaTEWS tsunami; peringatan</text>
<text x="853" y="323" font-size="12.5" fill="#334155">dini gempa (EEW)</text>
<rect x="837" y="380" width="310" height="104" rx="11" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="853" y="410" font-size="14.5" font-weight="700" fill="#b45309">Rekayasa gempa</text>
<text x="853" y="437" font-size="12.5" fill="#334155">Beban rencana bangunan,</text>
<text x="853" y="457" font-size="12.5" fill="#334155">SNI kegempaan</text>
<rect x="837" y="514" width="310" height="104" rx="11" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
<text x="853" y="544" font-size="14.5" font-weight="700" fill="#b45309">Eksplorasi energi</text>
<text x="853" y="571" font-size="12.5" fill="#334155">Migas, panas bumi, mineral,</text>
<text x="853" y="591" font-size="12.5" fill="#334155">penyimpanan CO2</text>
<circle cx="590" cy="330" r="92" fill="#1e293b"/>
