<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="1000" height="500" fill="#ffffff"/>
<text x="500" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Mengapa Gaya Saja Tidak Cukup</text>
<text x="500" y="55" text-anchor="middle" font-size="13.5" fill="#475569">Dua alasan mengapa seismologi memerlukan tensor, bukan angka biasa</text>
<line x1="500" y1="76" x2="500" y2="470" stroke="#e2e8f0" stroke-width="2"/>

<!-- ================= KIRI ================= -->
<text x="250" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#0e7490">Alasan 1 · Luas bidangnya berbeda</text>
<text x="250" y="121" text-anchor="middle" font-size="12.5" fill="#64748b">Gaya sama besar, akibatnya jauh berbeda</text>

<text x="145" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#dc2626">F = 100 N</text>
<text x="355" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#dc2626">F = 100 N</text>
<line x1="145" y1="160" x2="145" y2="184" stroke="#dc2626" stroke-width="3"/>
<polygon points="145,190 138,176 152,176" fill="#dc2626"/>
<line x1="355" y1="160" x2="355" y2="184" stroke="#dc2626" stroke-width="3"/>
<polygon points="355,190 348,176 362,176" fill="#dc2626"/>

<rect x="70" y="194" width="150" height="24" rx="4" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
<text x="145" y="211" text-anchor="middle" font-size="11" fill="#334155">telapak tangan</text>
<text x="145" y="232" text-anchor="middle" font-size="10.5" fill="#64748b">luas ≈ 100 cm²</text>
<rect x="70" y="240" width="150" height="42" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="145" y="266" text-anchor="middle" font-size="12" fill="#78350f">tidak melukai</text>

<rect x="347" y="194" width="16" height="24" rx="2" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
<text x="355" y="232" text-anchor="middle" font-size="10.5" fill="#64748b">luas ≈ 0,01 cm²</text>
<rect x="285" y="240" width="140" height="42" fill="#fee2e2" stroke="#dc2626" stroke-width="1.2"/>
<text x="355" y="266" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">menembus!</text>

<rect x="55" y="300" width="390" height="62" rx="9" fill="#ecfeff" stroke="#0e7490" stroke-width="1.6"/>
<text x="250" y="324" text-anchor="middle" font-size="14" font-weight="700" fill="#0e7490">Yang menentukan: gaya PER SATUAN LUAS</text>
<text x="250" y="349" text-anchor="middle" font-size="16" fill="#0f172a">tegangan = F / A     satuan pascal (Pa) = N/m²</text>

<!-- ================= KANAN ================= -->
<text x="750" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#b45309">Alasan 2 · Orientasi bidangnya berbeda</text>
<text x="750" y="121" text-anchor="middle" font-size="12.5" fill="#64748b">Gaya sama, tapi terbagi dengan cara berbeda</text>

<text x="750" y="152" text-anchor="middle" font-size="12.5" font-weight="700" fill="#dc2626">gaya yang sama persis pada kedua balok</text>
<line x1="635" y1="160" x2="635" y2="184" stroke="#dc2626" stroke-width="3"/>
<polygon points="635,190 628,176 642,176" fill="#dc2626"/>
<line x1="865" y1="160" x2="865" y2="184" stroke="#dc2626" stroke-width="3"/>
<polygon points="865,190 858,176 872,176" fill="#dc2626"/>

<g stroke="#334155" stroke-width="1.6" fill="#f1f5f9">
<rect x="575" y="194" width="120" height="88"/>
<rect x="805" y="194" width="120" height="88"/>
</g>
<line x1="575" y1="238" x2="695" y2="238" stroke="#0e7490" stroke-width="2.5" stroke-dasharray="6 4"/>
<line x1="805" y1="282" x2="925" y2="194" stroke="#b45309" stroke-width="2.5" stroke-dasharray="6 4"/>

<line x1="635" y1="238" x2="635" y2="266" stroke="#059669" stroke-width="2.5"/>
<polygon points="635,272 630,260 640,260" fill="#059669"/>
<text x="645" y="262" font-size="11" fill="#059669" font-weight="700">normal saja</text>

<line x1="865" y1="238" x2="884" y2="257" stroke="#059669" stroke-width="2.5"/>
<polygon points="888,261 876,257 883,250" fill="#059669"/>
<line x1="865" y1="238" x2="846" y2="257" stroke="#7c3aed" stroke-width="2.5"/>
<polygon points="842,261 847,250 854,257" fill="#7c3aed"/>
<text x="893" y="253" font-size="10.5" fill="#059669" font-weight="700">normal</text>
<text x="792" y="253" font-size="10.5" fill="#7c3aed" font-weight="700">geser</text>

<text x="635" y="299" text-anchor="middle" font-size="12" fill="#0e7490" font-weight="700">bidang mendatar</text>
<text x="865" y="299" text-anchor="middle" font-size="12" fill="#b45309" font-weight="700">bidang miring 45°</text>

<rect x="555" y="312" width="390" height="72" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
<text x="750" y="335" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">Bidang mendatar: seluruh gaya tegak lurus bidang.</text>
<text x="750" y="356" text-anchor="middle" font-size="13.5" font-weight="700" fill="#92400e">Bidang miring: gaya terbagi jadi normal DAN geser.</text>
<text x="750" y="376" text-anchor="middle" font-size="12" fill="#78350f">Satu angka tidak sanggup menyatakan keduanya sekaligus.</text>

<rect x="120" y="404" width="760" height="78" rx="10" fill="#0f172a"/>
<text x="500" y="431" text-anchor="middle" font-size="15.5" font-weight="700" fill="#ffffff">Karena itu kita memerlukan TENSOR</text>
<text x="500" y="454" text-anchor="middle" font-size="13" fill="#cbd5e1">Tensor tegangan bukan satu angka, melainkan satu &#8220;mesin&#8221; yang menyimpan jawaban</text>
<text x="500" y="472" text-anchor="middle" font-size="13" fill="#cbd5e1">untuk SEMUA orientasi bidang sekaligus. Tanyakan bidangnya, ia memberi gayanya.</text>
</svg>
