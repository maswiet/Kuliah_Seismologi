<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 470" width="1020" height="470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="1020" height="470" fill="#ffffff"/>
<text x="510" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Regangan: Tiga Hal yang Bisa Terjadi pada Sepotong Batuan</text>
<text x="510" y="55" text-anchor="middle" font-size="13.5" fill="#475569">Dua di antaranya regangan. Satu lagi bukan — dan membedakannya itu penting.</text>

<g font-size="14.5" font-weight="700" text-anchor="middle">
<text x="175" y="96" fill="#0e7490">1 · Regangan normal</text>
<text x="510" y="96" fill="#b45309">2 · Regangan geser</text>
<text x="845" y="96" fill="#64748b">3 · Rotasi benda tegar</text>
</g>
<g font-size="12" text-anchor="middle" fill="#64748b">
<text x="175" y="116">panjangnya berubah</text>
<text x="510" y="116">sudutnya berubah</text>
<text x="845" y="116">tidak ada yang berubah</text>
</g>

<!-- 1 normal -->
<rect x="105" y="140" width="90" height="90" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="105" y="140" width="140" height="76" fill="#ecfeff" stroke="#0e7490" stroke-width="2.5"/>
<g stroke="#dc2626" stroke-width="2.5">
<line x1="250" y1="178" x2="288" y2="178"/><line x1="100" y1="178" x2="62" y2="178"/>
</g>
<polygon points="294,178 282,172 282,184" fill="#dc2626"/><polygon points="56,178 68,172 68,184" fill="#dc2626"/>
<text x="175" y="252" text-anchor="middle" font-size="12.5" fill="#0e7490">memanjang mendatar, memendek tegak</text>
<text x="175" y="278" text-anchor="middle" font-size="15" fill="#0f172a">ε₁₁ = ΔL / L</text>
<text x="175" y="300" text-anchor="middle" font-size="11.5" fill="#64748b">sudut-sudutnya tetap 90°</text>

<!-- 2 geser -->
<rect x="450" y="140" width="90" height="90" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
<polygon points="478,140 568,140 540,230 450,230" fill="#fffbeb" stroke="#b45309" stroke-width="2.5"/>
<g stroke="#dc2626" stroke-width="2.5">
<line x1="470" y1="132" x2="530" y2="132"/><line x1="548" y1="238" x2="488" y2="238"/>
</g>
<polygon points="536,132 524,126 524,138" fill="#dc2626"/><polygon points="482,238 494,232 494,244" fill="#dc2626"/>
<path d="M 450 230 L 450 205 A 25 25 0 0 0 466 208" stroke="#b45309" stroke-width="2" fill="none"/>
<text x="466" y="222" font-size="12" fill="#b45309" font-weight="700">≠90°</text>
<text x="510" y="252" text-anchor="middle" font-size="12.5" fill="#b45309">panjang sisi hampir tetap, sudutnya berubah</text>
<text x="510" y="278" text-anchor="middle" font-size="15" fill="#0f172a">ε₁₂ = ½ (∂u₁/∂x₂ + ∂u₂/∂x₁)</text>
<text x="510" y="300" text-anchor="middle" font-size="11.5" fill="#64748b">inilah yang dilawan modulus geser μ</text>

<!-- 3 rotasi -->
<rect x="800" y="140" width="90" height="90" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
<g transform="rotate(20 845 185)">
<rect x="800" y="140" width="90" height="90" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/>
</g>
<path d="M 905 155 A 62 62 0 0 1 905 215" stroke="#64748b" stroke-width="2.5" fill="none"/>
<polygon points="905,221 899,209 911,209" fill="#64748b"/>
<text x="845" y="252" text-anchor="middle" font-size="12.5" fill="#64748b">panjang DAN sudut sama sekali tidak berubah</text>
<text x="845" y="278" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">ε = 0</text>
<text x="845" y="300" text-anchor="middle" font-size="11.5" fill="#64748b">bukan regangan — batuannya utuh</text>

<rect x="60" y="322" width="900" height="70" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
<text x="510" y="346" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Inilah alasan rumus regangan memakai setengah dan tanda TAMBAH</text>
<text x="510" y="369" text-anchor="middle" font-size="13" fill="#78350f">Bentuk ½(∂uᵢ/∂xⱼ + ∂uⱼ/∂xᵢ) sengaja dibuat agar kasus ke-3 menghasilkan nol.</text>
<text x="510" y="386" text-anchor="middle" font-size="13" fill="#78350f">Kalau tandanya kurang, yang terhitung justru rotasinya — bukan regangannya.</text>

<rect x="60" y="404" width="900" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
<text x="510" y="427" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">Seberapa besar regangan gelombang seismik? Sekitar 10⁻⁹ sampai 10⁻⁶.</text>
<text x="510" y="448" text-anchor="middle" font-size="12.5" fill="#1e40af">Pada batang sepanjang 1 meter, itu perubahan panjang sebesar 1 nanometer — beberapa diameter atom saja.</text>
</svg>
