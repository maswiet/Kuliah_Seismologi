<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="980" height="430" fill="#ffffff"/>
<text x="490" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Seismogram Bukan Gerakan Tanah</text>
<text x="490" y="57" text-anchor="middle" font-size="13.5" fill="#475569">Yang terekam adalah empat hal yang sudah tercampur — tiga di antaranya bukan gempanya</text>

<g stroke="#334155" stroke-width="1.8">
<rect x="26" y="92" width="150" height="76" rx="10" fill="#fef2f2"/>
<rect x="228" y="92" width="150" height="76" rx="10" fill="#eff6ff"/>
<rect x="430" y="92" width="150" height="76" rx="10" fill="#f5f3ff"/>
<rect x="632" y="92" width="150" height="76" rx="10" fill="#f8fafc"/>
<rect x="826" y="92" width="128" height="76" rx="10" fill="#ecfdf5"/>
</g>
<g text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f172a">
<text x="101" y="120">Sumber</text><text x="303" y="120">Lintasan</text><text x="505" y="120">Instrumen</text><text x="707" y="120">Derau</text><text x="890" y="120">Seismogram</text>
</g>
<g text-anchor="middle" font-size="12" fill="#64748b">
<text x="101" y="140">fungsi waktu</text><text x="101" y="156">sumber s(t)</text>
<text x="303" y="140">respons bumi</text><text x="303" y="156">g(t)</text>
<text x="505" y="140">respons alat</text><text x="505" y="156">i(t)</text>
<text x="707" y="140">derau ambien</text><text x="707" y="156">n(t)</text>
<text x="890" y="140">yang kita</text><text x="890" y="156">punya, u(t)</text>
</g>
<g text-anchor="middle" font-size="26" font-weight="700" fill="#334155">
<text x="202" y="139">&#8859;</text><text x="404" y="139">&#8859;</text><text x="606" y="139">+</text>
</g>
<text x="804" y="137" text-anchor="middle" font-size="22" font-weight="700" fill="#334155">=</text>

<rect x="230" y="196" width="520" height="34" rx="8" fill="#0f172a"/>
<text x="490" y="219" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">u(t) = s(t) &#8859; g(t) &#8859; i(t) + n(t)</text>

<text x="490" y="262" text-anchor="middle" font-size="14" fill="#0f172a">Tiga kerja pengolahan sinyal adalah tiga cara membalik persamaan itu:</text>

<g stroke-width="1.8">
<rect x="26" y="280" width="296" height="106" rx="10" fill="#ecfeff" stroke="#0e7490"/>
<rect x="342" y="280" width="296" height="106" rx="10" fill="#fffbeb" stroke="#b45309"/>
<rect x="658" y="280" width="296" height="106" rx="10" fill="#f0fdf4" stroke="#15803d"/>
</g>
<text x="46" y="306" font-size="14" font-weight="700" fill="#0e7490">Dekonvolusi respons</text>
<text x="46" y="329" font-size="12.5" fill="#334155">Membuang i(t) memakai metadata</text>
<text x="46" y="347" font-size="12.5" fill="#334155">instrumen (StationXML). Wajib</text>
<text x="46" y="365" font-size="12.5" fill="#334155">sebelum menghitung magnitudo.</text>

<text x="362" y="306" font-size="14" font-weight="700" fill="#b45309">Penapisan</text>
<text x="362" y="329" font-size="12.5" fill="#334155">Menekan n(t) pada pita frekuensi</text>
<text x="362" y="347" font-size="12.5" fill="#334155">yang deraunya menang. Selalu ada</text>
<text x="362" y="365" font-size="12.5" fill="#334155">harganya: bentuk gelombang berubah.</text>

<text x="678" y="306" font-size="14" font-weight="700" fill="#15803d">Stacking</text>
<text x="678" y="329" font-size="12.5" fill="#334155">Menumpuk banyak jejak: n(t) acak</text>
<text x="678" y="347" font-size="12.5" fill="#334155">saling meniadakan, sinyal koheren</text>
<text x="678" y="365" font-size="12.5" fill="#334155">bertahan. Perbaikan hanya &#8730;N.</text>

<text x="490" y="412" text-anchor="middle" font-size="12.5" fill="#64748b">Yang ingin kita ketahui hanya s(t) dan g(t). Dua faktor sisanya adalah gangguan yang kita sendiri yang harus menyingkirkannya.</text>
</svg>
