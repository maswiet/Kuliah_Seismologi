<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<rect width="940" height="470" fill="#ffffff"/>
<text x="470" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Dua Arah Kerja Seismologi</text>
<text x="470" y="60" text-anchor="middle" font-size="14" fill="#475569">Rantai fisisnya berjalan satu arah, tapi pertanyaan ilmiahnya ke arah sebaliknya</text>

<line x1="60" y1="104" x2="866" y2="104" stroke="#2563eb" stroke-width="3"/>
<polygon points="880,104 862,95 862,113" fill="#2563eb"/>
<rect x="296" y="91" width="348" height="27" rx="13" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="470" y="109" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d4ed8">MASALAH MAJU (forward problem)</text>

<g stroke="#334155" stroke-width="1.8" fill="#f8fafc">
<rect x="52" y="152" width="176" height="92" rx="10"/>
<rect x="264" y="152" width="176" height="92" rx="10"/>
<rect x="476" y="152" width="176" height="92" rx="10"/>
<rect x="688" y="152" width="176" height="92" rx="10"/>
</g>
<g text-anchor="middle" fill="#0f172a" font-size="15.5" font-weight="700">
<text x="140" y="182">Sumber gempa</text><text x="352" y="182">Struktur bumi</text>
<text x="564" y="182">Instrumen</text><text x="776" y="182">Seismogram</text>
</g>
<g text-anchor="middle" fill="#64748b" font-size="12">
<text x="140" y="205">lokasi, kedalaman,</text><text x="140" y="222">magnitudo, mekanisme</text>
<text x="352" y="205">kecepatan, densitas,</text><text x="352" y="222">lapisan, atenuasi</text>
<text x="564" y="205">respons seismometer,</text><text x="564" y="222">perekaman digital</text>
<text x="776" y="205">satu-satunya yang</text><text x="776" y="222">benar-benar kita punya</text>
</g>
<g stroke="#94a3b8" stroke-width="2.5">
<line x1="232" y1="198" x2="254" y2="198"/><line x1="444" y1="198" x2="466" y2="198"/><line x1="656" y1="198" x2="678" y2="198"/>
</g>
<g fill="#94a3b8">
<polygon points="262,198 248,192 248,204"/><polygon points="474,198 460,192 460,204"/><polygon points="686,198 672,192 672,204"/>
</g>

<line x1="880" y1="288" x2="74" y2="288" stroke="#dc2626" stroke-width="3"/>
<polygon points="60,288 78,279 78,297" fill="#dc2626"/>
<rect x="290" y="275" width="360" height="27" rx="13" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<text x="470" y="293" text-anchor="middle" font-size="13.5" font-weight="700" fill="#b91c1c">MASALAH BALIK (inverse problem)</text>

<text x="470" y="342" text-anchor="middle" font-size="15" fill="#0f172a">Yang kita PUNYA hanya kotak paling kanan.</text>
<text x="470" y="365" text-anchor="middle" font-size="15" fill="#0f172a">Yang kita INGIN TAHU ada di kotak paling kiri.</text>

<rect x="110" y="386" width="720" height="72" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="470" y="410" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">Di sinilah sumber semua kesulitan dalam seismologi</text>
<text x="470" y="431" text-anchor="middle" font-size="13" fill="#78350f">Masalah maju punya satu jawaban. Masalah balik bisa punya banyak jawaban</text>
<text x="470" y="449" text-anchor="middle" font-size="13" fill="#78350f">yang sama-sama cocok dengan data — dan hanya sebagian yang benar secara fisis.</text>
</svg>
